name: AI Compose preflight

on:
  push:
    branches: [feature/ai-investigation-inference]
    paths:
      - 'compose*.yaml'
      - 'Dockerfile.ai*'
      - 'scripts/check-ai-compose.py'
      - 'scripts/smoke-ai-image.sh'
      - 'scripts/up*'
      - 'scripts/down*'
      - 'scripts/_lifecycle.py'
      - 'scripts/resolve-ai-revisions.sh'
      - 'scripts/ai-doctor.py'
      - 'scripts/ai-connect.*'
      - 'scripts/test_ai_connect.py'
      - 'AI.md'
      - '.github/workflows/ai-compose-preflight.yml'
  pull_request:
    paths:
      - 'compose*.yaml'
      - 'Dockerfile.ai*'
      - 'scripts/check-ai-compose.py'
      - 'scripts/smoke-ai-image.sh'
      - 'scripts/up*'
      - 'scripts/down*'
      - 'scripts/_lifecycle.py'
      - 'scripts/resolve-ai-revisions.sh'
      - 'scripts/ai-doctor.py'
      - 'scripts/ai-connect.*'
      - 'scripts/test_ai_connect.py'
      - 'AI.md'
      - '.github/workflows/ai-compose-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose version
        run: docker compose version
      - name: Validate startup and diagnostic script syntax
        run: |
          bash -n scripts/up scripts/down scripts/resolve-ai-revisions.sh scripts/smoke-ai-image.sh scripts/check-ai-stack-ready.sh scripts/ai-connect.sh
          python3 -m py_compile scripts/up.py scripts/down.py scripts/_lifecycle.py scripts/check-ai-compose.py scripts/ai-doctor.py scripts/ai-connect.py
      - name: Assistant connector tests
        run: python3 -m unittest scripts/test_ai_connect.py
      - name: Validate isolated AI test-stack topology and each startup profile
        run: python3 scripts/check-ai-compose.py
      - name: Confirm default service and AI subcommand resolve from one Compose file
        run: |
          docker compose config --quiet
      - name: Local-source overlay resolves and refuses to run unset
        run: |
          AMASS_LOCAL_SRC=. docker compose -f compose.yaml -f compose.local-src.yaml config --quiet
          if docker compose -f compose.yaml -f compose.local-src.yaml config --quiet 2>/dev/null; then
            echo "overlay must fail without AMASS_LOCAL_SRC"; exit 1
          fi

  image-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build feature image and check CLI binaries (no database startup)
        run: bash scripts/smoke-ai-image.sh
