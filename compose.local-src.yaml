# Overlay that builds the AI image from a local Amass checkout instead of the
# GitHub feature branch. ./scripts/up --local [PATH] applies it (or AMASS_LOCAL_SRC
# in the environment/.env), naming that checkout (default ../amass). All AI
# services share the image.
services:
  ai:
    build:
      dockerfile: Dockerfile.ai-local
      additional_contexts:
        amass-src: ${AMASS_LOCAL_SRC:?set AMASS_LOCAL_SRC to a local amass checkout}
