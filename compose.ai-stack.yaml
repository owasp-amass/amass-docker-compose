# OPTIONAL full-framework regression overlay. Use only in a disposable
# checkout with backed-up/empty PostgreSQL data.
# Pass: -f compose.yaml -f compose.ai.yaml -f compose.ai-stack.yaml
# Existing service names, mounts, dependencies and network stay intact.
services:
  enum:
    image: ${AMASS_AI_IMAGE:-amass-ai:dev}
  viz:
    image: ${AMASS_AI_IMAGE:-amass-ai:dev}
  subs:
    image: ${AMASS_AI_IMAGE:-amass-ai:dev}
  assoc:
    image: ${AMASS_AI_IMAGE:-amass-ai:dev}
  track:
    image: ${AMASS_AI_IMAGE:-amass-ai:dev}
  engine:
    image: ${AMASS_AI_IMAGE:-amass-ai:dev}
  assetdb:
    build: https://github.com/owasp-amass/asset-db.git#feature/ai-investigation-inference
