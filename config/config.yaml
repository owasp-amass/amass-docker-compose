scope:
#  domains: # registered domain names in scope
#    - owasp.org
#  ips: # IP addresses in scope, multiple methods of inserting IP addresses can be used
#    - 192.0.2.1
#    - 192.0.2.2
#    - 192.168.0.3-8
#    - 192.168.0.10-192.168.0.20
#  cidrs: # CIDR ranges that are in scope
#    - 192.0.2.0/24
#    - 192.0.2.128/25
#  asns: # autonomous systems whose announced networks are in scope
#    - 64496
  # To probe an organization's own servers for SSH and mail, put its address
  # space in scope with ips, cidrs or asns above (its netblocks from the
  # registry, or the AS numbers it operates). Addresses of in-scope names are
  # probed too; shared hosting and cloud addresses outside the listed space
  # are not.
  #
  # Ports active enumeration may probe on in-scope names and addresses, for
  # every service. Each probe tries the ports it knows a protocol for: the SSH
  # probe 22, the greeting probes 21 (FTP), 25 and 587 (SMTP), 465 (SMTPS),
  # 110 and 995 (POP3), 143 and 993 (IMAP). The HTTP probes try the rest.
  # Remove a port to stop probing it; ranges such as "8000-8010" work too.
  ports:
    - 21    # FTP
    - 22    # SSH
    - 25    # SMTP
    - 110   # POP3
    - 143   # IMAP
    - 465   # SMTP over TLS
    - 587   # SMTP submission
    - 993   # IMAP over TLS
    - 995   # POP3 over TLS
    - 80
    - 443
    - 8000
    - 8080
    - 8443
    - 8888
    - 9443  # web administration consoles
    - 10000 # Webmin
    # Management and data APIs that answer HTTP; the exposure lens reports them.
    - 2375  # Docker Engine API (unencrypted)
    - 2379  # etcd client API
    - 5984  # CouchDB
    - 6443  # Kubernetes API server
    - 8500  # Consul HTTP API
    - 9200  # Elasticsearch / OpenSearch REST API
    - 10250 # Kubernetes kubelet API
#  blacklist: # subdomains to be blacklisted
#    - example.owasp.org
options:
  datasources: "./datasources.yaml"
  engine: "http://engine:4000"
  # be sure to set your username and password in the following URI to the 
  # AMASS_USER and AMASS_PASSWORD values, respectively, in your .env file
  # database: "bolt://neo4j:amass4OWASP@neo4j:7687/neo4j"
  database: "postgres://amass:amass4OWASP@assetdb:5432/assetdb"
  bruteforce:
    enabled: false
    wordlists: # wordlist(s) to use that are specific to brute forcing
      - "./wordlists/short-wordlist.txt"
      #- "./wordlists/subdomains-top1mil-5000.txt"
      #- "./wordlists/subdomains-top1mil-20000.txt"
      #- "./wordlists/subdomains-top1mil-110000.txt"
  alterations:
    enabled: false
    wordlists: # wordlist(s) to use that are specific to name alterations
      - "./wordlists/alterations.txt"
  default_transform_values:
    ttl: 1440 # minutes. If not specified, the default is 1440 minutes (1 day)
    confidence: 50 # 50%
    priority: 5

transformations:
  Account->ALL:
    ttl: 10800 # 7 days
  AutnumRecord->ALL:
  AutonomousSystem->ALL:
  AutonomousSystem->RDAP:
    ttl: 43200 # 30 days
  ContactRecord->ALL:
  DomainRecord->ALL:
  File->ALL:
  FQDN->ALL:
  FQDN->DomainRecord:
    ttl: 43200 # 30 days
  FundsTransfer->ALL:
    ttl: 10800 # 7 days
  Identifier->ALL:
  Identifier->GLEIF:
    ttl: 43200 # 30 days
  Identifier->RDAP:
    ttl: 43200 # 30 days
  IPAddress->ALL:
  IPNetRecord->ALL:
  Location->ALL:
    confidence: 80
  Netblock->ALL:
  Netblock->RDAP:
    ttl: 43200 # 30 days
  Organization->ALL:
  Organization->GLEIF:
    ttl: 43200 # 30 days
  Person->ALL:
    ttl: 43200 # 30 days
  Phone->ALL:
    ttl: 10800 # 7 days
  Product->ALL:
    ttl: 10800 # 7 days
  ProductRelease->ALL:
  Service->ALL:
  TLSCertificate->ALL:
    ttl: 10800 # 7 days
  URL->ALL:

