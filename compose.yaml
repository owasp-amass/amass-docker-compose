# SPDX-License-Identifier: Apache-2.0
# Single-file, isolated feature-branch Amass environment.
# The default/release Compose deployment on main is unchanged.
name: ${AMASS_TEST_NAMESPACE:-amass-ai-test}

# AI services: use scripts/ai-up.sh for single-command startup.
x-ai-image: &ai-image
  image: ${AMASS_AI_IMAGE:-amass-ai:dev}
  networks: [amass]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

x-ai-provider-env: &ai-provider-env
  AMASS_AI_PROVIDER: ${AMASS_AI_PROVIDER:-compatible}
  AMASS_AI_ENDPOINT: ${AMASS_AI_ENDPOINT:-http://ollama:11434/v1/chat/completions}
  AMASS_AI_MODEL: ${AMASS_AI_MODEL:-qwen3:8b}
  AMASS_AI_API_KEY: ${AMASS_AI_API_KEY:-}
  AMASS_AI_ALLOW_HTTP: ${AMASS_AI_ALLOW_HTTP:-false}
  AMASS_AI_MODEL_TIMEOUT: ${AMASS_AI_MODEL_TIMEOUT:-4m}
  AMASS_AI_INVESTIGATION_TIMEOUT: ${AMASS_AI_INVESTIGATION_TIMEOUT:-12m}

services:

  # Optional CLI for ad-hoc investigations; NOT a daemon on 'up -d'.
  ai:
    <<: *ai-image
    # Exactly like enum/subs/assoc: this is a one-shot amass subcommand.
    # Use: docker compose run --rm ai -question "..." ask
    build:
      context: .
      dockerfile: Dockerfile.ai
      args:
        AMASS_REF: ${AMASS_AI_AMASS_REF:-feature/ai-investigation-inference}
        ASSETDB_REF: ${AMASS_AI_ASSETDB_REF:-feature/ai-investigation-inference}
        AMASS_SHA: ${AMASS_AI_AMASS_SHA:-}
        ASSETDB_SHA: ${AMASS_AI_ASSETDB_SHA:-}
        AMASS_UID: ${AMASS_AI_UID:-1000}
        AMASS_GID: ${AMASS_AI_GID:-1000}
    env_file: [./config/logs/syslog.env]
    environment:
      <<: *ai-provider-env
      XDG_CONFIG_HOME: /data/.config
      AMASS_AI_CLASSIFIER_ENDPOINT: http://classifier:8092
      AMASS_AI_CLASSIFIER_REVIEW: ${AMASS_AI_CLASSIFIER_REVIEW:-true}
    volumes:
      - ./config:/.config/amass:ro
      - ./data/ai:/data:rw
    depends_on:
      assetdb: {condition: service_healthy}
      classifier: {condition: service_healthy}
      provider-health: {condition: service_healthy}
    entrypoint: ["/bin/amass", "ai", "-config", "/.config/amass/config.yaml"]

  # Always-on classifier, fully independent of Ollama/Anthropic/etc.
  classifier:
    <<: *ai-image
    environment:
      AMASS_AI_CLASSIFIER_MODEL: /models/classifier.json
      AMASS_AI_CLASSIFIER_LISTEN: 0.0.0.0:8092
    volumes:
      - ./data/models:/models:ro
    entrypoint: ["/bin/amass-ai-classifier"]
    expose: ["8092"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8092/readyz"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  # On-demand curated training job. The startup script runs this only if
  # labeled.jsonl exists and classifier.json has not yet been produced.
  classifier-train:
    <<: *ai-image
    profiles: [ai-train]
    volumes:
      - ./data/classifier-training:/training:ro
      - ./data/models:/models:rw
    entrypoint: ["/bin/amass-ai-classifier-train"]
    command:
      - -input
      - /training/labeled.jsonl
      - -output
      - /models/classifier.json

  # Actual inference probe; reports unhealthy until the selected MODEL has
  # answered a request. Health polling only checks a cached readiness status.
  provider-health:
    <<: *ai-image
    environment:
      <<: *ai-provider-env
    entrypoint: ["/bin/amass-ai-provider-health"]
    expose: ["8091"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/readyz"]
      interval: 20s
      timeout: 5s
      start_period: 10m
      retries: 3
    restart: unless-stopped

  # Persistent, authenticated read-only Streamable HTTP MCP server.
  ai-mcp:
    <<: *ai-image
    env_file: [./config/logs/syslog.env]
    environment:
      XDG_CONFIG_HOME: /data/.config
      AMASS_AI_MCP_TOKEN: ${AMASS_AI_MCP_TOKEN:-}
    volumes:
      - ./config:/.config/amass:ro
      - ./data/ai:/data:rw
    ports:
      - "127.0.0.1:${AMASS_AI_MCP_PORT:-18090}:8090"
    # MCP tools only read the Asset Database; they never call the model or
    # classifier, so MCP must not wait for a model download or warm-up.
    depends_on:
      assetdb: {condition: service_healthy}
    entrypoint: ["/bin/amass-ai-mcp-http", "-config", "/.config/amass/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/readyz"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  # Backward-compatible stdio MCP, only when explicitly run by an MCP client.
  ai-mcp-stdio:
    <<: *ai-image
    profiles: [ai-stdio]
    env_file: [./config/logs/syslog.env]
    environment:
      XDG_CONFIG_HOME: /data/.config
    volumes:
      - ./config:/.config/amass:ro
      - ./data/ai:/data:rw
    depends_on:
      assetdb: {condition: service_healthy}
    stdin_open: true
    tty: false
    entrypoint: ["/bin/amass-ai-mcp", "-config", "/.config/amass/config.yaml"]

  # Auto-selected by scripts/ai-up.sh for the local Ollama provider.
  ollama:
    profiles: [ai-local]
    image: ${AMASS_AI_OLLAMA_IMAGE:-ollama/ollama:0.40.15}
    networks: [amass]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ./data/ollama:/root/.ollama:rw
    expose: ["11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 8
    restart: unless-stopped

  # One-shot initializer: model downloads as part of the same 'up' command.
  ollama-pull:
    profiles: [ai-local]
    image: ${AMASS_AI_OLLAMA_IMAGE:-ollama/ollama:0.40.15}
    networks: [amass]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/ollama", "pull"]
    command: ["${AMASS_AI_MODEL:-qwen3:8b}"]
    depends_on:
      ollama: {condition: service_healthy}
    restart: "no"

  enum:
    image: ${AMASS_AI_IMAGE:-amass-ai:dev}
    networks:
      - amass
    env_file:
      - ./config/logs/syslog.env
    volumes:
      - ./config:/.config/amass:rw
      - ./data/enum:/data:rw
    depends_on:
      engine:
        condition: service_healthy
      syslog:
        condition: service_healthy
    entrypoint: /bin/enum

  viz:
    image: ${AMASS_AI_IMAGE:-amass-ai:dev}
    networks:
      - amass
    env_file:
      - ./config/logs/syslog.env
    volumes:
      - ./config:/.config/amass:rw
      - ./data/viz:/data:rw
    depends_on:
      assetdb:
        condition: service_healthy
#      neo4j:
#        condition: service_healthy
      syslog:
        condition: service_healthy
    entrypoint: /bin/viz

  subs:
    image: ${AMASS_AI_IMAGE:-amass-ai:dev}
    networks:
      - amass
    env_file:
      - ./config/logs/syslog.env
    volumes:
      - ./config:/.config/amass:rw
      - ./data/subs:/data:rw
    depends_on:
      assetdb:
        condition: service_healthy
#      neo4j:
#        condition: service_healthy
      syslog:
        condition: service_healthy
    entrypoint: /bin/subs

  assoc:
    image: ${AMASS_AI_IMAGE:-amass-ai:dev}
    networks:
      - amass
    env_file:
      - ./config/logs/syslog.env
    volumes:
      - ./config:/.config/amass:rw
      - ./data/assoc:/data:rw
    depends_on:
      assetdb:
        condition: service_healthy
#      neo4j:
#        condition: service_healthy
      syslog:
        condition: service_healthy
    entrypoint: /bin/assoc

  track:
    image: ${AMASS_AI_IMAGE:-amass-ai:dev}
    networks:
      - amass
    env_file:
      - ./config/logs/syslog.env
    volumes:
      - ./config:/.config/amass:rw
      - ./data/track:/data:rw
    depends_on:
      assetdb:
        condition: service_healthy
#      neo4j:
#        condition: service_healthy
      syslog:
        condition: service_healthy
    entrypoint: /bin/track

  engine:
    image: ${AMASS_AI_IMAGE:-amass-ai:dev}
    container_name: ${AMASS_TEST_NAMESPACE:-amass-ai-test}-engine
    working_dir: /.config/amass
    networks:
      - amass
    environment:
      - POSTAL_SERVER_HOST=postal
      - POSTAL_SERVER_PORT=8000
    env_file:
      - ./config/logs/syslog.env
    volumes:
      - ./data/engine:/.config/amass:rw
    expose: 
      - "4000"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 3s
        max_attempts: 5
        window: 360s
      resources:
        reservations:
          memory: 1024M
    depends_on:
      assetdb:
        condition: service_healthy
#      neo4j:
#        condition: service_healthy
      postal:
        condition: service_healthy
      syslog:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "ae_isready", "--host", "127.0.0.1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: /bin/engine

  assetdb:
    build: https://github.com/owasp-amass/asset-db.git#feature/ai-investigation-inference
    shm_size: '4gb'
    container_name: ${AMASS_TEST_NAMESPACE:-amass-ai-test}-assetdb
    networks:
      - amass
    volumes:
      - ./assetdb/postgres:/var/lib/postgresql:rw
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - AMASS_DB=${AMASS_DB}
      - AMASS_USER=${AMASS_USER}
      - AMASS_PASSWORD=${AMASS_PASSWORD}
    ports:
      - "127.0.0.1:${AMASS_TEST_DB_PORT:-55433}:5432"
    deploy:
      restart_policy:
        condition: any
      resources:
        reservations:
          memory: 512M
    entrypoint:
      - sh
      - -euc
      - |
        /usr/local/bin/docker-entrypoint.sh postgres

  neo4j:
    image: neo4j:latest
    container_name: ${AMASS_TEST_NAMESPACE:-amass-ai-test}-neo4j
    networks:
      - amass
    volumes:
      - ./assetdb/neo4j:/data:rw
    environment:
      - NEO4J_AUTH=neo4j/${AMASS_PASSWORD}
      - NEO4J_server_memory_heap_max__size=4G
    ports:
      - "127.0.0.1:${AMASS_TEST_NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${AMASS_TEST_NEO4J_BOLT_PORT:-17687}:7687"
    deploy:
      restart_policy:
        condition: any
      resources:
        reservations:
          memory: 2048M
    healthcheck:
      test: [ "CMD-SHELL", "exit 0" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postal:
    build: https://github.com/owasp-amass/libpostal-rest-api.git#main
    container_name: ${AMASS_TEST_NAMESPACE:-amass-ai-test}-postal
    networks:
      - amass
    environment:
      - POSTAL_SERVER_PORT=8000
    env_file:
      - ./config/logs/syslog.env
    expose: 
      - "8000"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 3s
        max_attempts: 5
        window: 360s
      resources:
        reservations:
          memory: 2048M
    depends_on:
      syslog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://postal:8000/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: /bin/post_serv

  syslog:
    image: lscr.io/linuxserver/syslog-ng:latest
    container_name: ${AMASS_TEST_NAMESPACE:-amass-ai-test}-syslog
    networks:
      - amass
    environment:
      - TZ=Etc/UTC
    volumes:
      - ./config/logs:/config:rw
      - ./logs:/var/log:rw
    expose:
      - "5514/udp"
      - "6601/tcp"
      - "6514/tcp"
    deploy:
      restart_policy:
        condition: any
    healthcheck:
      test: [ "CMD-SHELL", "exit 0" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  amass:
    driver: bridge
    name: ${AMASS_TEST_NAMESPACE:-amass-ai-test}-net
